  function viewCat(id) {
    const nm = catName(id) || "구분 없음";
    const list = S.entries.filter(e => (e.catId || "") === (id || "") && monthsInYear(e, S.year).length);
    const byMonth = {};
    list.forEach(e => monthsInYear(e, S.year).forEach(m => { (byMonth[m] = byMonth[m] || []).push(e); }));
    const months = Object.keys(byMonth).sort((a, b) => b.localeCompare(a));
    const panel = el("div", { class: "panel" }, [
      el("div", { class: "panel-head" }, [el("h2", { text: "달별" }),
        (id && canEdit()) ? el("button", { class: "btn sm quiet", style: "margin-left:auto", onclick: () => openNameForm("cat", catById(id)) }, [icon("pencil", 13)]) : null].filter(Boolean))
    ]);
    if (!months.length) panel.append(el("div", { class: "empty" }, [icon("tag", 24), el("div", { text: "이 해에는 기록이 없어요" })]));
    months.forEach(m => {
      const rows = byMonth[m].filter(e => matchEntry(e, S.q));
      if (!rows.length) return;
      const tot = rows.reduce((s, e) => s + perMonth(e), 0);
      const tb = el("tbody");
      rows.forEach(e => tb.append(el("tr", {}, [
        el("td", { class: "num", style: "color:var(--ink-3)", text: e.date }),
        el("td", { style: "font-weight:600", text: e.title }),
        el("td", {}, [el("span", { class: "pill" + (e.kind === "card" ? " rose" : "") }, [ownerOf(e).name || "—"])]),
        el("td", {}, [statusPill(e, m) || el("span", { style: "color:var(--ink-3)", text: "—" })]),
        el("td", { class: "r num", style: "font-weight:600", text: money(perMonth(e)) })
      ])));
      panel.append(el("div", { class: "table-wrap" }, [el("table", { style: "min-width:500px" }, [
        el("thead", {}, [el("tr", { class: "mhead" }, [el("td", { colspan: "4", text: dot(m) }), el("td", { class: "r num", text: money(tot) })])]),
        tb
      ])]));
    });
    return el("div", { style: "display:flex;flex-direction:column;gap:18px" }, [
      detailHero({ eyebrow: S.year + " · 구분", name: nm, icon: "tag", accent: "#5ff0c5", sum: yearSum(list), series: monthlySeries(list, S.year),
        caps: [el("span", {}, [icon("doc", 13), " ", el("b", { text: list.length + "건" })])] }),
      panel
    ]);
  }

  function viewSearch() {
    return el("div", { class: "panel" }, [
      el("div", { class: "panel-head" }, [icon("search", 15), el("h2", { text: S.q }),
        el("span", { class: "chip", text: S.entries.filter(e => matchEntry(e, S.q)).length + "건" })]),
      ledger(S.entries, { byMonth: false })
    ]);
  }

  function viewRates() {
    const base = Object.assign({ USD: 1380, CNY: 192 }, S.rates.base || {});
    const draft = JSON.parse(JSON.stringify(S.rates)); draft.base = base;
    const used = [...new Set(S.entries.filter(e => e.currency !== "KRW").map(e => ymOf(e.date)))].sort().reverse();
    const rows = el("div", { style: "display:flex;flex-direction:column;gap:10px" });
    if (used.length) used.slice(0, 18).forEach(m => rows.append(el("div", { class: "grid3" }, [
      field("달", input({ value: m, readonly: "readonly" })),
      field("USD", input({ type: "number", step: "0.01", placeholder: String(base.USD), value: (draft[m] || {}).USD || "", oninput: ev => { draft[m] = Object.assign({}, draft[m]); draft[m].USD = +ev.target.value || 0; } })),
      field("CNY", input({ type: "number", step: "0.01", placeholder: String(base.CNY), value: (draft[m] || {}).CNY || "", oninput: ev => { draft[m] = Object.assign({}, draft[m]); draft[m].CNY = +ev.target.value || 0; } }))
    ])));
    else rows.append(el("div", { style: "color:var(--ink-3);font-size:12.5px" }, ["외화 기록이 생기면 그 달이 여기 나와요"]));

    return el("div", { class: "panel" }, [
      el("div", { class: "panel-head" }, [icon("fx", 15), el("h2", { text: "환율" })]),
      el("div", { style: "padding:18px;display:flex;flex-direction:column;gap:16px" }, [
        el("div", { class: "grid2" }, [
          field("USD → 원", input({ type: "number", step: "0.01", value: base.USD, oninput: ev => { draft.base.USD = +ev.target.value || 0; } })),
          field("CNY → 원", input({ type: "number", step: "0.01", value: base.CNY, oninput: ev => { draft.base.CNY = +ev.target.value || 0; } }))
        ]),
        rows,
        canEdit() ? el("div", {}, [el("button", {
          class: "btn primary", onclick: async () => {
            if (!S.db) return toast("저장소에 연결되지 않았어요.", true);
            Object.keys(draft).forEach(k => { if (k !== "base" && draft[k] && !draft[k].USD && !draft[k].CNY) delete draft[k]; });
            try { await S.db.doc("meta/rates").set(draft); toast("저장했어요."); }
            catch (err) { toast(dbMsg(err), true); }
          }
        }, ["저장"])]) : el("span", { class: "chip view" }, ["보기 전용"])
      ])
    ]);
  }

  function viewBackup() {
    const head = ["종류", "칸", "일자", "내용", "구분", "방식", "개월", "통화", "금액", "환율", "원화", "청구달", "용도", "메모"];
    const lines = [head].concat(S.entries.map(e => [
      e.kind === "card" ? "카드" : "기둥", ownerOf(e).name || "", e.date, e.title, catName(e.catId),
      e.mode === "split" ? "할부" : e.mode === "monthly" ? "매달" : "일시불",
      e.mode === "split" ? e.months : "", e.currency, e.amount, rateFor(e), Math.round(krwTotal(e)),
      e.billMonth || "", e.purpose || "", String(e.memo || "").replace(/\s+/g, " ")
    ]));
    const csv = "﻿" + lines.map(r => r.map(c => `"${String(c === undefined || c === null ? "" : c).replace(/"/g, '""')}"`).join(",")).join("\r\n");
    const save = async (filename, data) => {
      try { await S.downloads.save({ filename, data }); toast("내려받기 요청했어요."); }
      catch (err) { toast(err && err.code === "not_granted" ? "허용하지 않았어요." : "내려받지 못했어요.", true); }
    };
    return el("div", { class: "panel" }, [
      el("div", { class: "panel-head" }, [icon("down", 15), el("h2", { text: "내보내기" })]),
      el("div", { style: "padding:18px;display:flex;flex-direction:column;gap:14px" }, [
        el("div", { class: "minis" }, [
          el("div", { class: "mini" }, [el("div", { class: "top" }, [icon("doc", 13), el("span", { class: "c", text: "기록" })]), el("div", { class: "v", text: S.entries.length })]),
          el("div", { class: "mini" }, [el("div", { class: "top" }, [icon("chart", 13), el("span", { class: "c", text: "기둥" })]), el("div", { class: "v", text: S.groups.length })]),
          el("div", { class: "mini" }, [el("div", { class: "top" }, [icon("card", 13), el("span", { class: "c", text: "카드" })]), el("div", { class: "v", text: S.cards.length })]),
          el("div", { class: "mini" }, [el("div", { class: "top" }, [icon("tag", 13), el("span", { class: "c", text: "구분" })]), el("div", { class: "v", text: S.cats.length })])
        ]),
        S.downloads ? el("div", { style: "display:flex;gap:9px;flex-wrap:wrap" }, [
          el("button", { class: "btn primary", onclick: () => save(`한눈장부_${todayISO()}.csv`, csv) }, [icon("down", 14), "CSV"]),
          el("button", {
            class: "btn", onclick: () => save(`한눈장부_${todayISO()}.json`, JSON.stringify(
              { savedAt: new Date().toISOString(), groups: S.groups, cards: S.cards, cats: S.cats, entries: S.entries, rates: S.rates }, null, 2))
          }, [icon("down", 14), "JSON"])
        ]) : el("div", { style: "color:var(--ink-3);font-size:12.5px" }, ["여기서는 내려받기를 못 써요"]),
        canEdit() ? el("div", { style: "border-top:1px solid var(--edge);padding-top:14px" }, [el("button", {
          class: "btn danger", onclick: () => confirmSheet("전부 비우기", "기록·기둥·카드·구분을 모두 지웁니다. 되돌릴 수 없어요.", "비우기", async () => {
            for (const e of S.entries) await drop("entries", e.id);
            for (const g of S.groups) await drop("groups", g.id);
            for (const c of S.cards) await drop("cards", c.id);
            for (const c of S.cats) await drop("cats", c.id);
            S.view = { type: "dash" }; render(); toast("비웠어요.");
          })
        }, ["전부 비우기"])]) : null
      ].filter(Boolean))
    ]);
  }

  /* ========================== 사이드바 ========================== */
  function renderRail() {
    const go = v => () => { S.view = v; clearSearch(); S.railOpen = false; render(); };
    const navBtn = (name, amount, color, active, onclick) => el("button", {
      class: "navbtn", "aria-current": String(!!active), onclick
    }, [
      el("span", { class: "dot", style: `background:${color}` }),
      el("span", { class: "nm", text: name }),
      amount === null ? null : el("span", { class: "amt", text: brief(amount) })
    ].filter(Boolean));
    const group = (label, items, adder) => {
      const b = el("div", {}, label ? [el("div", { class: "rail-label", text: label })] : []);
      items.forEach(i => b.append(i));
      if (adder && canEdit()) b.append(adder);
      return b;
    };
    const swap = (id, node) => { node.id = id; const cur = $("#" + id); if (cur) cur.replaceWith(node); };

    swap("navHome", group(null, [el("button", {
      class: "navbtn", "aria-current": String(S.view.type === "dash"), onclick: go({ type: "dash" })
    }, [icon("home", 15), el("span", { class: "nm", text: "한눈에" })])]));

    swap("navPillars", group("기둥",
      S.groups.map(g => navBtn(g.name, yearSum(entriesOf("group", g.id)), g.accent || "#b45cff",
        S.view.type === "group" && S.view.id === g.id, go({ type: "group", id: g.id }))),
      el("button", { class: "navbtn ghost", onclick: () => openNameForm("group") }, [icon("plus", 13), "항목"])));

    swap("navCards", group("카드",
      S.cards.map(c => navBtn(c.name, yearSum(entriesOf("card", c.id)), c.accent || "#ff6fd8",
        S.view.type === "card" && S.view.id === c.id, go({ type: "card", id: c.id }))),
      el("button", { class: "navbtn ghost", onclick: () => openNameForm("card") }, [icon("plus", 13), "카드"])));

    const tot = {};
    S.entries.forEach(e => { const v = yearTotal(e, S.year); if (v) tot[e.catId || ""] = (tot[e.catId || ""] || 0) + v; });
    const items = S.cats.slice().sort((a, b) => (tot[b.id] || 0) - (tot[a.id] || 0))
      .map(c => navBtn(c.name, tot[c.id] || 0, "#5ff0c5", S.view.type === "cat" && S.view.id === c.id, go({ type: "cat", id: c.id })));
    if (tot[""]) items.push(navBtn("구분 없음", tot[""], "#6d5f8c", S.view.type === "cat" && S.view.id === "", go({ type: "cat", id: "" })));
    swap("navCats", group("구분", items));

    swap("navTools", group("도구", [
      canEdit() ? el("button", { class: "navbtn", onclick: () => { S.railOpen = false; renderRail(); openStatementReader(); } }, [icon("doc", 15), el("span", { class: "nm", text: "명세서 읽기" })]) : null,
      el("button", { class: "navbtn", "aria-current": String(S.view.type === "rates"), onclick: go({ type: "rates" }) }, [icon("fx", 15), el("span", { class: "nm", text: "환율" })]),
      el("button", { class: "navbtn", "aria-current": String(S.view.type === "backup"), onclick: go({ type: "backup" }) }, [icon("down", 15), el("span", { class: "nm", text: "내보내기" })])
    ].filter(Boolean)));

    $("#rail").classList.toggle("open", S.railOpen);
    $("#railScrim").classList.toggle("on", S.railOpen);
    $("#brandSub").textContent = S.year + " · " + brief(yearSum(S.entries));
  }

  function renderYears() {
    const box = $("#yearPick");
    box.replaceChildren();
    const ys = availableYears();
    const span = ys.length > 4 ? ys.slice(-4) : ys.slice();
    if (!span.includes(S.year)) span.push(S.year);
    span.sort((a, b) => a - b).forEach(y => box.append(el("button", {
      type: "button", "aria-pressed": String(y === S.year), onclick: () => { S.year = y; render(); }
    }, [String(y).slice(2)])));
    box.append(el("button", {
      type: "button", "aria-label": "다른 연도", onclick: () => {
        const all = [...new Set(ys.concat([S.year - 1, S.year + 1]))].sort((a, b) => a - b);
        const m = modal({
          title: "연도", body: [el("div", { class: "chips" }, all.map(y => el("button", {
            type: "button", "aria-pressed": String(y === S.year), onclick: () => { S.year = y; m.close(); render(); }
          }, [String(y)])))]
        });
      }
    }, ["⋯"]));
  }

  function renderChip() {
    const c = $("#modeChip");
    c.className = "chip";
    c.replaceChildren();
    if (!S.db) { c.classList.add("warn"); c.append("저장소 없음"); return; }
    if (!canEdit()) { c.classList.add("view"); c.append(icon("check", 12), "보기 전용"); return; }
    c.classList.add("live"); c.append(icon("check", 12), "저장됨");
  }

  function clearSearch() { S.q = ""; const s = $("#search"); if (s) s.value = ""; }

  /* ========================== 렌더 ========================== */
  function render() {
    renderYears(); renderChip(); renderRail();
    const host = $("#view");
    host.replaceChildren();
    if (!S.loaded) { host.append(el("div", { class: "empty" }, [el("span", { class: "pulse" }), "여는 중…"])); return; }
    if (!S.groups.length && !S.cards.length && S.view.type === "dash") { host.append(firstRun()); return; }
    let node;
    switch (S.view.type) {
      case "group": node = viewGroup(S.view.id); break;
      case "card": node = viewCard(S.view.id); break;
      case "cat": node = viewCat(S.view.id); break;
      case "rates": node = viewRates(); break;
      case "backup": node = viewBackup(); break;
      case "search": node = viewSearch(); break;
      default: node = viewDash();
    }
    host.append(node);
  }

  function firstRun() {
    return el("div", { class: "hero", style: "gap:14px" }, [
      el("div", { class: "eyebrow", text: "시작" }),
      el("div", { class: "big", style: "font-size:clamp(26px,4vw,38px)", text: "기둥부터 세워요" }),
      el("div", { style: "display:flex;gap:10px;flex-wrap:wrap;margin-top:6px" },
        canEdit() ? [
          el("button", {
            class: "btn primary", onclick: async () => {
              const g = [["대출", "#b45cff"], ["할부", "#ff6fd8"], ["고정지출", "#5ff0c5"], ["취미지출", "#ffcb6b"]];
              for (let i = 0; i < g.length; i++) await put("groups", uid(), { name: g[i][0], accent: g[i][1], order: i });
              const c = [["현대카드", "#ff6fd8"], ["신한카드", "#7ab8ff"]];
              for (let i = 0; i < c.length; i++) await put("cards", uid(), { name: c[i][0], accent: c[i][1], order: i });
              toast("기본 칸을 만들었어요.");
            }
          }, [icon("plus", 14), "기본 4칸 + 카드 2장"]),
          el("button", { class: "btn", onclick: () => openNameForm("group") }, ["직접"])
        ] : [el("span", { class: "chip view" }, ["PC 에서 만들어 주세요"])])
    ]);
  }

  /* ========================== 시작 ========================== */
  $("#brandMark").append(icon("wallet", 19, 1.8));
  $("#searchIco").append(icon("search", 15));
  $("#menuToggle").append(icon("menu", 17));

  // 금액 가리기 — 옆에 사람이 있을 때
  let zen = false;
  try { zen = localStorage.getItem("zen") === "1"; } catch (_) {}
  function paintZen() {
    document.body.classList.toggle("zen", zen);
    const b = $("#zenToggle");
    b.setAttribute("aria-pressed", String(zen));
    b.replaceChildren(icon(zen ? "eyeoff" : "eye", 16));
  }
  $("#zenToggle").addEventListener("click", () => {
    zen = !zen; paintZen();
    try { localStorage.setItem("zen", zen ? "1" : "0"); } catch (_) {}
  });
  paintZen();

  let qt;
  $("#search").addEventListener("input", e => {
    S.q = e.target.value;
    clearTimeout(qt);
    qt = setTimeout(() => {
      if (S.q.trim() && (S.view.type === "dash")) S.view = { type: "search" };
      else if (!S.q.trim() && S.view.type === "search") S.view = { type: "dash" };
      render();
    }, 160);
  });
  $("#menuToggle").addEventListener("click", () => { S.railOpen = !S.railOpen; renderRail(); });
  $("#railScrim").addEventListener("click", () => { S.railOpen = false; renderRail(); });
  document.addEventListener("keydown", e => {
    if (e.key === "/" && document.activeElement !== $("#search") && !closeModal) { e.preventDefault(); $("#search").focus(); }
    if (e.key === "n" && !closeModal && document.activeElement !== $("#search") && canEdit()) {
      if (S.view.type === "group") openEntryForm({ kind: "group", parent: S.view.id });
      else if (S.view.type === "card") openEntryForm({ kind: "card", parent: S.view.id });
    }
  });
  let rz;
  window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(render, 200); });

  render();
  connectDb();
  (async () => {
    S.sample = await useCap("sample");
    if (S.sample && S.sample.limits) {
      const l = await S.sample.limits().catch(() => null);
      S.imagesOK = !!(l && l.images);
    }
    S.downloads = await useCap("downloads");
    render();
  })();
  try {
    const hot = window.claude && window.claude.hot;
    if (hot && hot.snapshot) {
      hot.snapshot(() => ({ view: S.view, year: S.year }));
      const boot = d => { if (d && d.view) { S.view = d.view; S.year = d.year || S.year; } render(); };
      hot.ready ? hot.ready(boot) : boot(hot.data);
    }
  } catch (_) {}
})();
</script>
