<title>한눈 장부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800;900&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">
<style>
  :root{
    --bg:#0c0616;
    --bg-2:#150a26;
    /* 유리판 — 뒤 격자무늬가 글씨를 가로지르지 않게 바탕을 어느 정도 덮는다 */
    --glass:rgba(36,17,62,.58);
    --glass-2:rgba(52,26,86,.68);
    --edge:rgba(255,255,255,.11);
    --edge-hi:rgba(216,180,254,.42);
    --ink:#fdfaff;
    --ink-2:rgba(253,250,255,.72);
    --ink-3:rgba(253,250,255,.42);
    --violet:#b45cff;
    --violet-hi:#d08bff;
    --violet-deep:#7826d6;
    --pink:#ff6fd8;
    --mint:#5ff0c5;
    --gold:#ffcb6b;
    --rose:#ff6f91;
    --sky:#7ab8ff;
    --glow:0 20px 50px -22px rgba(180,92,255,.9);
    --r:22px; --r-sm:14px;
    --fd:"Gothic A1","IBM Plex Sans KR",system-ui,sans-serif;
    --fb:"IBM Plex Sans KR","Gothic A1",system-ui,sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;color:var(--ink);font-family:var(--fb);font-size:14px;line-height:1.55;
    background:var(--bg);-webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(1100px 620px at 12% -10%, rgba(180,92,255,.46), transparent 60%),
      radial-gradient(900px 560px at 96% 0%, rgba(255,111,216,.24), transparent 56%),
      radial-gradient(800px 700px at 50% 108%, rgba(120,38,214,.30), transparent 62%);
    background-attachment:fixed;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
    background-size:56px 56px;
    -webkit-mask-image:radial-gradient(1000px 700px at 30% 0%,#000,transparent 72%);
    mask-image:radial-gradient(1000px 700px at 30% 0%,#000,transparent 72%);
  }
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none}
  :focus-visible{outline:2px solid var(--violet-hi);outline-offset:3px;border-radius:10px}
  h1,h2,h3{font-family:var(--fd);margin:0;text-wrap:balance;letter-spacing:-.02em}
  .num{font-variant-numeric:tabular-nums}
  svg{display:block}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:9px;border:3px solid transparent;background-clip:content-box}

  /* ---------- shell ---------- */
  .app{display:grid;grid-template-columns:238px minmax(0,1fr);height:100%;position:relative;z-index:1}
  .rail{
    display:flex;flex-direction:column;gap:6px;min-height:0;overflow:auto;
    padding:20px 12px calc(20px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
    backdrop-filter:blur(18px);border-right:1px solid var(--edge);
  }
  .brand{display:flex;align-items:center;gap:10px;padding:2px 8px 12px}
  .brand-mark{
    width:34px;height:34px;border-radius:12px;flex:none;display:grid;place-items:center;
    background:linear-gradient(150deg,var(--violet-hi),var(--violet-deep));box-shadow:var(--glow);color:#fff
  }
  .brand b{font-family:var(--fd);font-size:16px;font-weight:800;letter-spacing:-.03em;display:block;line-height:1.25}
  .brand span{display:block;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .rail-label{font-size:10px;letter-spacing:.16em;color:var(--ink-3);text-transform:uppercase;padding:14px 10px 5px;font-weight:700}
  .navbtn{
    display:flex;align-items:center;gap:9px;width:100%;text-align:left;
    padding:8px 10px;border-radius:12px;color:var(--ink-2);font-size:13px;
    transition:background .15s,color .15s
  }
  .navbtn:hover{background:var(--glass);color:var(--ink)}
  .navbtn[aria-current="true"]{background:linear-gradient(90deg,rgba(180,92,255,.40),rgba(180,92,255,.08));color:#fff;font-weight:600}
  .navbtn .dot{width:7px;height:7px;border-radius:2.5px;flex:none}
  .navbtn .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .navbtn .amt{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none}
  .navbtn[aria-current="true"] .amt{color:rgba(255,255,255,.8)}
  .navbtn.ghost{color:var(--ink-3);font-size:12px}
  .navbtn.ghost:hover{color:var(--violet-hi)}

  .main{min-width:0;overflow:auto;display:flex;flex-direction:column}
  .topbar{
    position:sticky;top:env(safe-area-inset-top,0px);z-index:30;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 28px;
    background:rgba(12,6,22,.66);backdrop-filter:blur(18px);border-bottom:1px solid var(--edge);
  }
  .menu-toggle{display:none}
  .searchbox{
    flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:9px;
    background:var(--glass);border:1px solid var(--edge);border-radius:999px;padding:8px 15px
  }
  .searchbox input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:13px}
  .searchbox input::placeholder{color:var(--ink-3)}
  .yearpick{display:flex;align-items:center;gap:2px;background:var(--glass);border:1px solid var(--edge);border-radius:999px;padding:4px}
  .yearpick button{padding:4px 11px;border-radius:999px;color:var(--ink-3);font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
  .yearpick button:hover{color:var(--ink)}
  .yearpick button[aria-pressed="true"]{background:linear-gradient(150deg,var(--violet-hi),var(--violet-deep));color:#fff;box-shadow:var(--glow)}
  .content{padding:24px 28px 64px;display:flex;flex-direction:column;gap:26px;flex:1}

  .chip{
    display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;
    font-size:11.5px;font-weight:600;border:1px solid var(--edge);color:var(--ink-2);background:var(--glass)
  }
  .chip.view{border-color:rgba(255,203,107,.4);color:var(--gold);background:rgba(255,203,107,.1)}
  .chip.live{border-color:rgba(95,240,197,.34);color:var(--mint);background:rgba(95,240,197,.08)}
  .chip.warn{border-color:rgba(255,111,145,.42);color:var(--rose);background:rgba(255,111,145,.1)}

  .btn{
    display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:8px 16px;
    font-size:13px;font-weight:600;background:var(--glass-2);color:var(--ink);
    border:1px solid var(--edge);transition:transform .12s,background .15s,border-color .15s
  }
  .btn:hover{background:rgba(255,255,255,.14);border-color:var(--edge-hi)}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:linear-gradient(150deg,var(--violet-hi),var(--violet-deep));border-color:transparent;color:#fff;box-shadow:var(--glow)}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.quiet{background:transparent;color:var(--ink-2)}
  .btn.danger{background:transparent;border-color:rgba(255,111,145,.45);color:var(--rose)}
  .btn.sm{padding:6px 12px;font-size:12px}
  .btn[disabled]{opacity:.42;cursor:not-allowed}
  .iconbtn{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:var(--ink-3);flex:none}
  .iconbtn:hover{background:var(--glass-2);color:var(--ink)}
  .iconbtn.del:hover{color:var(--rose);background:rgba(255,111,145,.12)}

  /* ---------- hero ---------- */
  .hero-row{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:18px}
  .hero{
    position:relative;overflow:hidden;border-radius:26px;padding:26px 28px;
    background:linear-gradient(140deg,rgba(208,139,255,.34) 0%,rgba(120,38,214,.30) 46%,rgba(255,111,216,.16) 100%),var(--glass);
    border:1px solid var(--edge-hi);box-shadow:var(--glow);backdrop-filter:blur(20px);
    display:flex;flex-direction:column;gap:6px
  }
  .hero::after{
    content:"";position:absolute;right:-70px;top:-90px;width:290px;height:290px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.22),transparent 66%);pointer-events:none
  }
  .eyebrow{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.62);font-weight:700}
  .hero .big{font-family:var(--fd);font-weight:900;font-size:clamp(32px,5vw,50px);line-height:1.02;letter-spacing:-.045em}
  .hero .cap{font-size:12px;color:rgba(255,255,255,.66);display:flex;gap:16px;flex-wrap:wrap;margin-top:4px}
  .hero .cap span{display:inline-flex;align-items:center;gap:5px}
  .hero .cap b{color:rgba(255,255,255,.94);font-weight:600}
  .spark{width:100%;height:92px;margin-top:10px}

  .glass{
    border-radius:var(--r);background:var(--glass);border:1px solid var(--edge);
    backdrop-filter:blur(16px);
  }
  .side{padding:20px;display:flex;flex-direction:column;gap:3px;min-width:0}
  .side .top{display:flex;align-items:center;gap:8px;color:var(--ink-3)}
  .side .v{font-family:var(--fd);font-weight:900;font-size:28px;letter-spacing:-.035em;font-variant-numeric:tabular-nums;margin:4px 0 8px}
  .bar-row{display:flex;align-items:center;gap:9px;padding:6px 0}
  .bar-row .k{font-size:12px;color:var(--ink-2);width:64px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar-row .track{display:block;flex:1;height:7px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden}
  .bar-row .fill{display:block;height:100%;border-radius:99px}
  .bar-row .v{font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--ink-2);flex:none;width:62px;text-align:right}

  /* ---------- sections ---------- */
  .sec{display:flex;flex-direction:column;gap:14px}
  .sec-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .sec-head h2{font-size:15px;font-weight:800;letter-spacing:-.01em}
  .sec-head .sum{margin-left:auto;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}

  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px}
  .tile{
    position:relative;text-align:left;border-radius:var(--r);padding:18px;min-height:172px;
    background:linear-gradient(155deg,color-mix(in srgb,var(--c,#b45cff) 30%,rgba(30,14,54,.7)),rgba(30,14,54,.72));
    border:1px solid var(--edge);backdrop-filter:blur(16px);
    display:flex;flex-direction:column;gap:9px;
    transition:transform .16s,border-color .16s,box-shadow .16s
  }
  .tile:hover{transform:translateY(-3px);border-color:var(--edge-hi);box-shadow:0 22px 46px -26px var(--c,#b45cff)}
  .tile.dragging{opacity:.35;transform:scale(.97)}
  .tile.over{border-color:var(--violet-hi);box-shadow:inset 0 0 0 1px var(--violet-hi)}
  .tile-ico{
    width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none;color:#fff;
    background:linear-gradient(150deg,color-mix(in srgb,var(--c,#b45cff) 92%,#fff 8%),color-mix(in srgb,var(--c,#b45cff) 55%,#000 25%));
    box-shadow:0 10px 22px -12px var(--c,#b45cff)
  }
  .tile-nm{font-family:var(--fd);font-weight:800;font-size:14.5px;letter-spacing:-.01em}
  .tile-sum{font-family:var(--fd);font-weight:900;font-size:26px;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1.05}
  .tile-rows{display:flex;flex-direction:column;gap:5px;margin-top:auto}
  .tile-row{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-2);min-width:0}
  .tile-row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pill{
    display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:17px;
    flex:none;font-size:10px;font-weight:700;padding:2px 7px;border-radius:7px;letter-spacing:.01em;
    background:rgba(255,255,255,.13);color:rgba(255,255,255,.88);font-variant-numeric:tabular-nums
  }
  .pill.prog{background:linear-gradient(90deg,rgba(255,255,255,.34) var(--p,0%),rgba(255,255,255,.09) var(--p,0%))}
  .pill.mint{background:rgba(95,240,197,.16);color:var(--mint)}
  .pill.gold{background:rgba(255,203,107,.16);color:var(--gold)}
  .pill.rose{background:rgba(255,111,145,.16);color:var(--rose)}
  .pill.sky{background:rgba(122,184,255,.16);color:var(--sky)}
  .grip{
    position:absolute;top:12px;right:10px;color:rgba(255,255,255,.28);opacity:0;transition:opacity .15s;
    cursor:grab;padding:2px
  }
  .tile:hover .grip{opacity:1}
  .tile:not([draggable="true"]) .grip{display:none}
  .tile-add{
    border:1px dashed var(--edge);border-radius:var(--r);color:var(--ink-3);min-height:172px;
    display:grid;place-items:center;gap:6px;background:rgba(255,255,255,.02)
  }
  .tile-add:hover{border-color:var(--violet-hi);color:var(--violet-hi);background:rgba(180,92,255,.08)}

  .minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(174px,1fr));gap:12px}
  .mini{
    border-radius:18px;padding:15px;background:var(--glass);border:1px solid var(--edge);
    backdrop-filter:blur(14px);display:flex;flex-direction:column;gap:3px;text-align:left;min-width:0
  }
  button.mini:hover{border-color:var(--edge-hi);background:var(--glass-2)}
  .mini .top{display:flex;align-items:center;gap:7px;color:var(--ink-3);font-size:11.5px}
  .mini .v{font-family:var(--fd);font-weight:800;font-size:19px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:3px}
  .mini .c{font-size:11px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ---------- table ---------- */
  .panel{border-radius:var(--r);background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(16px);overflow:hidden}
  .panel-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:15px 18px;border-bottom:1px solid var(--edge)}
  .panel-head h2{font-size:14.5px;font-weight:800}
  .table-wrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;min-width:640px}
  th,td{padding:10px 16px;text-align:left;font-size:12.8px;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:middle}
  th{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
  td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
  tbody tr:hover{background:rgba(255,255,255,.04)}
  tr.done td{color:var(--ink-3)}
  tr.mhead td{background:rgba(255,255,255,.05);font-family:var(--fd);font-weight:800;font-size:12px;color:rgba(255,255,255,.9);letter-spacing:.01em}
  .rowbtns{display:flex;gap:4px;justify-content:flex-end}
  .empty{padding:44px 20px;text-align:center;color:var(--ink-3);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:12px}

  .banner{
    display:flex;align-items:center;gap:11px;border-radius:16px;padding:12px 16px;font-size:12.5px;
    background:rgba(255,203,107,.09);border:1px solid rgba(255,203,107,.28);color:#ffe0ac
  }
  .banner .btn{margin-left:auto}

  /* ---------- modal ---------- */
  .scrim{
    position:fixed;inset:0;z-index:80;background:rgba(8,3,16,.7);backdrop-filter:blur(8px);
    display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto
  }
  .sheet{
    width:100%;max-width:640px;border-radius:24px;margin:auto;overflow:hidden;
    background:linear-gradient(160deg,rgba(60,28,100,.96),rgba(22,10,40,.98));
    border:1px solid var(--edge-hi);box-shadow:0 44px 100px -44px #000
  }
  .sheet.wide{max-width:940px}
  .sheet-head{display:flex;align-items:center;gap:10px;padding:18px 20px 14px;border-bottom:1px solid var(--edge)}
  .sheet-head h3{font-size:16px;font-weight:800;flex:1}
  .sheet-body{padding:18px 20px;display:flex;flex-direction:column;gap:14px;max-height:64vh;overflow:auto}
  .sheet-foot{display:flex;gap:9px;justify-content:flex-end;padding:14px 20px 18px;border-top:1px solid var(--edge);flex-wrap:wrap}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .field{display:flex;flex-direction:column;gap:5px;min-width:0}
  .field > label{font-size:10.5px;letter-spacing:.08em;color:var(--ink-3);font-weight:700;text-transform:uppercase}
  .field input,.field select,.field textarea{
    background:rgba(0,0,0,.3);border:1px solid var(--edge);border-radius:11px;padding:9px 12px;
    font-size:13px;outline:none;width:100%;min-width:0
  }
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--violet-hi);background:rgba(0,0,0,.45)}
  .field .hint{font-size:11px;color:var(--ink-3)}
  .seg{display:flex;gap:4px;background:rgba(0,0,0,.3);border:1px solid var(--edge);border-radius:11px;padding:3px}
  .seg button{flex:1;padding:6px 4px;border-radius:8px;font-size:12px;font-weight:600;color:var(--ink-3)}
  .seg button[aria-pressed="true"]{background:linear-gradient(150deg,var(--violet-hi),var(--violet-deep));color:#fff}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips button{border-radius:999px;padding:4px 11px;font-size:11.5px;border:1px solid var(--edge);color:var(--ink-2);background:rgba(0,0,0,.25)}
  .chips button[aria-pressed="true"]{background:rgba(180,92,255,.3);border-color:var(--violet-hi);color:#fff}
  .drop{
    border:1.5px dashed var(--edge);border-radius:18px;padding:30px 18px;text-align:center;color:var(--ink-3);
    font-size:13px;display:flex;flex-direction:column;align-items:center;gap:9px;background:rgba(255,255,255,.03)
  }
  .drop.hot{border-color:var(--violet-hi);background:rgba(180,92,255,.12);color:var(--ink)}
  .filelist{display:flex;flex-wrap:wrap;gap:6px}
  .thinking{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2)}
  .pulse{width:9px;height:9px;border-radius:50%;background:var(--violet-hi);animation:p 1.1s ease-in-out infinite;flex:none}
  @keyframes p{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
  .rev input,.rev select{background:transparent;border:1px solid transparent;border-radius:8px;padding:5px 7px;font-size:12.5px;width:100%}
  .rev input:hover,.rev select:hover{border-color:var(--edge)}
  .rev input:focus,.rev select:focus{border-color:var(--violet-hi);background:rgba(0,0,0,.4)}
  .rev td{padding:4px 8px}

  .toast{
    position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
    z-index:95;background:linear-gradient(150deg,rgba(70,32,120,.98),rgba(30,12,55,.98));
    border:1px solid var(--edge-hi);border-radius:999px;padding:10px 20px;font-size:13px;
    box-shadow:0 24px 50px -26px #000;max-width:90vw
  }
  .toast.bad{border-color:rgba(255,111,145,.5);color:#ffc6d2}

  /* ---------- responsive ---------- */
  @media (max-width:1040px){ .hero-row{grid-template-columns:1fr} }
  @media (max-width:860px){
    .app{grid-template-columns:1fr}
    .rail{position:fixed;inset:0 auto 0 0;width:250px;z-index:70;transform:translateX(-103%);transition:transform .22s ease;background:#170b2a;box-shadow:26px 0 60px -30px #000}
    .rail.open{transform:none}
    .menu-toggle{display:inline-flex}
    .topbar{padding:12px 16px}
    .content{padding:18px 16px 60px;gap:20px}
    .grid2,.grid3{grid-template-columns:1fr}
    .hero{padding:20px}
    .tiles{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:11px}
    .tile{min-height:150px;padding:15px}
    .tile-sum{font-size:22px}
    table{min-width:520px}
  }
  /* 금액 가리기 */
  body.zen .num, body.zen .tile-sum, body.zen .mini .v, body.zen .side .v,
  body.zen .sec-head .sum, body.zen .bar-row .v, body.zen .navbtn .amt,
  body.zen .hero .big, body.zen .spark{filter:blur(9px);user-select:none;pointer-events:none}
  .rail-scrim{position:fixed;inset:0;z-index:65;background:rgba(8,3,16,.6);display:none}
  .rail-scrim.on{display:block}
  @media (min-width:861px){.rail-scrim{display:none!important}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <aside class="rail" id="rail">
    <div class="brand">
      <div class="brand-mark" id="brandMark"></div>
      <div>
        <b>한눈 장부</b>
        <span id="brandSub">—</span>
      </div>
    </div>
    <div id="navHome"></div>
    <div id="navPillars"></div>
    <div id="navCards"></div>
    <div id="navCats"></div>
    <div id="navTools"></div>
  </aside>
  <div class="rail-scrim" id="railScrim"></div>

  <main class="main">
    <header class="topbar">
      <button class="iconbtn menu-toggle" id="menuToggle" aria-label="메뉴"></button>
      <div class="searchbox">
        <span id="searchIco" aria-hidden="true"></span>
        <input id="search" placeholder="금액 · 이름 · 날짜 · 구분" aria-label="장부 검색">
      </div>
      <div class="yearpick" id="yearPick" role="group" aria-label="연도"></div>
      <button class="iconbtn" id="zenToggle" aria-label="금액 가리기" aria-pressed="false"></button>
      <span class="chip" id="modeChip">…</span>
    </header>
    <div class="content" id="view"></div>
  </main>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function () {
  "use strict";

  /* ========================== 아이콘 ========================== */
  const P = {
    home:"M3 10.5 12 3l9 7.5M5.5 9.5V20h13V9.5",
    loan:"M3 9.5 12 4l9 5.5M5 10v8m5-8v8m4-8v8m5-8v8M3 20h18",
    split:"M4 6h16M4 12h10M4 18h6",
    repeat:"M4 9a5 5 0 0 1 5-5h10m0 0-3-3m3 3-3 3M20 15a5 5 0 0 1-5 5H5m0 0 3 3m-3-3 3-3",
    spark:"M12 3.5 13.8 9l5.7 1.8-5.7 1.8L12 18.5 10.2 12.6 4.5 10.8 10.2 9z",
    card:"M2.5 7.5h19v10a2 2 0 0 1-2 2h-15a2 2 0 0 1-2-2zM2.5 10.5h19M6 15.5h4",
    search:"M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM16.2 16.2 21 21",
    plus:"M12 5v14M5 12h14",
    menu:"M4 7h16M4 12h16M4 17h16",
    doc:"M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zm0 0v5h5M9 13h6M9 17h4",
    fx:"M4 8h13m0 0-3.5-3.5M17 8l-3.5 3.5M20 16H7m0 0 3.5-3.5M7 16l3.5 3.5",
    down:"M12 4v12m0 0 4.5-4.5M12 16l-4.5-4.5M4.5 19.5h15",
    tag:"M3 12.5V4h8.5l8.5 8.5-8.5 8.5zM7.5 7.5h.01",
    clock:"M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm0 4.5V12l3.5 2",
    chart:"M4 20V9m5 11V4m5 16v-7m5 7V7",
    pencil:"M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17z",
    x:"M6 6l12 12M18 6 6 18",
    grip:"M9 5h.01M15 5h.01M9 12h.01M15 12h.01M9 19h.01M15 19h.01",
    wallet:"M3 7.5A2.5 2.5 0 0 1 5.5 5H18v2.5M3 7.5V18a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3M3 7.5h16a2 2 0 0 1 2 2V12h-4.5a1.75 1.75 0 0 0 0 3.5H21",
    check:"M5 12.5 10 17.5 19 7",
    eye:"M2 12s3.8-6.5 10-6.5S22 12 22 12s-3.8 6.5-10 6.5S2 12 2 12zm10-2.4a2.4 2.4 0 1 0 0 4.8 2.4 2.4 0 0 0 0-4.8z",
    eyeoff:"M4 4l16 16M9.9 5.7A9.8 9.8 0 0 1 12 5.5c6.2 0 10 6.5 10 6.5a18 18 0 0 1-3.3 4M6.3 8A18 18 0 0 0 2 12s3.8 6.5 10 6.5a9.9 9.9 0 0 0 3.6-.66"
  };
  function icon(name, size, sw) {
    const s = size || 18;
    const ns = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", "0 0 24 24"); svg.setAttribute("width", s); svg.setAttribute("height", s);
    svg.setAttribute("fill", "none"); svg.setAttribute("stroke", "currentColor");
    svg.setAttribute("stroke-width", sw || 1.7);
    svg.setAttribute("stroke-linecap", "round"); svg.setAttribute("stroke-linejoin", "round");
    svg.setAttribute("aria-hidden", "true");
    const p = document.createElementNS(ns, "path");
    p.setAttribute("d", P[name] || P.tag);
    svg.append(p);
    return svg;
  }
  // 칸 이름에서 어울리는 기호 고르기
  function iconFor(name) {
    const n = String(name || "");
    if (/대출|빚|융자|담보/.test(n)) return "loan";
    if (/할부|분납/.test(n)) return "split";
    if (/고정|정기|구독|월세|보험|공과/.test(n)) return "repeat";
    if (/취미|여가|문화|놀이|덕질|게임/.test(n)) return "spark";
    if (/카드/.test(n)) return "card";
    if (/저축|적금|투자/.test(n)) return "chart";
    return "wallet";
  }

  /* ========================== 도구 ========================== */
  const $ = (s, r) => (r || document).querySelector(s);
  const el = (tag, attrs, kids) => {
    const n = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      const v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "html") n.innerHTML = v;
      else if (k === "text") n.textContent = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v);
    }
    (kids || []).forEach(c => { if (c !== null && c !== undefined && c !== false) n.append(c.nodeType ? c : document.createTextNode(c)); });
    return n;
  };
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  // ₩(U+20A9) 는 가로줄이 글자 폭 밖으로 넘쳐 뒤 숫자를 가로지른다(서체 무관).
  // 그래서 원화는 기호 대신 '원'을 뒤에 붙인다. 달러·위안 기호는 멀쩡하므로 그대로 쓴다.
  const CUR = { KRW: "", USD: "$", CNY: "¥" };
  const won = n => (Math.round(n) || 0).toLocaleString("ko-KR");
  const money = n => won(n) + "원";
  // 큰 숫자는 억·만으로 — 화면에서 자릿수 소음을 줄인다
  function brief(n) {
    const a = Math.abs(Math.round(n));
    if (a >= 100000000) { const v = a / 100000000; return (v >= 100 ? Math.round(v).toLocaleString("ko-KR") : v.toFixed(1).replace(/\.0$/, "")) + "억"; }
    if (a >= 10000) { const v = a / 10000; return (v >= 100 ? Math.round(v).toLocaleString("ko-KR") : v.toFixed(1).replace(/\.0$/, "")) + "만"; }
    return won(a) + "원";
  }
  const todayISO = () => new Date().toISOString().slice(0, 10);
  const ymOf = d => String(d || "").slice(0, 7);
  const dot = ym => String(ym || "").replace("-", ".");
  const addMonths = (ym, k) => {
    const y = +ym.slice(0, 4), m = +ym.slice(5, 7) - 1 + k;
    const ny = y + Math.floor(m / 12), nm = ((m % 12) + 12) % 12 + 1;
    return ny + "-" + String(nm).padStart(2, "0");
  };
  const monthDiff = (a, b) => (+b.slice(0, 4) - +a.slice(0, 4)) * 12 + (+b.slice(5, 7) - +a.slice(5, 7));

  let toastTimer;
  function toast(msg, bad) {
    const t = $("#toast");
    t.textContent = msg; t.hidden = false; t.classList.toggle("bad", !!bad);
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3200);
  }

  /* ========================== 상태 ========================== */
  const NOW_YM = ymOf(todayISO());
  const S = {
    view: { type: "dash" }, year: +NOW_YM.slice(0, 4), q: "",
    groups: [], cards: [], cats: [], entries: [],
    rates: { base: { USD: 1380, CNY: 192 } },
    db: null, sample: null, downloads: null, imagesOK: false,
    loaded: false, railOpen: false
  };
  // 편집은 PC 에서만. 창 너비가 아니라 입력 장치로 가른다 —
  // 작게 띄운 PC 창에서도 고칠 수 있고, 폰·태블릿은 손가락이라 보기 전용이 된다.
  const canEdit = () => window.matchMedia("(pointer: fine)").matches && window.innerWidth >= 700;
  const COLORS = ["#b45cff", "#ff6fd8", "#5ff0c5", "#ffcb6b", "#7ab8ff", "#ff8a6f", "#9d8bff", "#4fd1e6"];

  const groupById = id => S.groups.find(g => g.id === id);
  const cardById = id => S.cards.find(c => c.id === id);
  const catById = id => S.cats.find(c => c.id === id);
  const catName = id => (catById(id) || {}).name || "";
  const ownerOf = e => groupById(e.parent) || cardById(e.parent) || {};

  /* ========================== 금액 계산 ========================== */
  function rateFor(e) {
    if (e.currency === "KRW") return 1;
    if (e.rate > 0) return e.rate;
    const m = S.rates[ymOf(e.date)] || {};
    return m[e.currency] || (S.rates.base || {})[e.currency] || 1;
  }
  const krwTotal = e => (e.amount || 0) * rateFor(e);
  const startMonth = e => (e.kind === "card" ? (e.billMonth || ymOf(e.date)) : ymOf(e.date));
  function lastMonth(e) {
    const s = startMonth(e);
    if (e.mode === "split") return addMonths(s, Math.max(1, e.months || 1) - 1);
    if (e.mode === "monthly") return e.endMonth || "9999-12";
    return s;
  }
  const perMonth = e => (e.mode === "split" ? krwTotal(e) / Math.max(1, e.months || 1) : krwTotal(e));
  function monthsInYear(e, year) {
    const y0 = year + "-01", y1 = year + "-12";
    const s = startMonth(e), l = lastMonth(e);
    const a = s > y0 ? s : y0, b = l < y1 ? l : y1;
    if (!a || a > b) return [];
    const out = []; let c = a;
    while (c <= b && out.length < 13) { out.push(c); c = addMonths(c, 1); }
    return out;
  }
  const yearTotal = (e, year) => monthsInYear(e, year).length * perMonth(e);
  const seqAt = (e, ym) => monthDiff(startMonth(e), ym) + 1;
  const seqNow = e => Math.min(Math.max(seqAt(e, NOW_YM), 1), Math.max(1, e.months || 1));
  // '완납'은 할부에만 있는 상태다 — 지나간 일시불은 그냥 지난 기록일 뿐
  const isFinished = e => e.mode === "split" && lastMonth(e) < NOW_YM;
  const isRunning = e => startMonth(e) <= NOW_YM && lastMonth(e) >= NOW_YM;
  // 남은 원금 — 할부에서 아직 안 낸 회차 합
  const leftToPay = e => (e.mode === "split" && isRunning(e))
    ? perMonth(e) * (e.months - seqNow(e) + 1) : 0;

  // 카드 결제 주기: 마감일이 4면 6.5~7.4 가 7월 청구
  function cycleLabel(card, billYm) {
    const d = +(card && card.cycleDay);
    if (!d || !billYm) return "";
    return `${+addMonths(billYm, -1).slice(5, 7)}.${d + 1} ~ ${+billYm.slice(5, 7)}.${d}`;
  }
  const entriesOf = (kind, parent) => S.entries.filter(e => e.kind === kind && e.parent === parent);
  const yearSum = list => list.reduce((s, e) => s + yearTotal(e, S.year), 0);
  const monthSum = (list, ym) => list.filter(e => monthsInYear(e, +ym.slice(0, 4)).includes(ym)).reduce((s, e) => s + perMonth(e), 0);

  function monthlySeries(list, year) {
    const arr = new Array(12).fill(0);
    list.forEach(e => monthsInYear(e, year).forEach(m => { arr[+m.slice(5, 7) - 1] += perMonth(e); }));
    return arr;
  }
  function availableYears() {
    const set = new Set([S.year, +NOW_YM.slice(0, 4)]);
    S.entries.forEach(e => {
      const s = +startMonth(e).slice(0, 4); if (s > 1990 && s < 2200) set.add(s);
      const l = lastMonth(e); if (l !== "9999-12") { const y = +l.slice(0, 4); if (y > 1990 && y < 2200) set.add(y); }
    });
    return [...set].sort((a, b) => a - b);
  }

  /* ========================== 스마트 검색 ========================== */
  function parseAmount(t) {
    const m = t.replace(/,/g, "").match(/^(\d+(?:\.\d+)?)(억|만|천)?원?$/);
    if (!m) return null;
    const k = m[2] === "억" ? 1e8 : m[2] === "만" ? 1e4 : m[2] === "천" ? 1e3 : 1;
    return +m[1] * k;
  }
  function matchEntry(e, q) {
    if (!q || !q.trim()) return true;
    const hay = [e.title, catName(e.catId), e.purpose, e.memo, ownerOf(e).name, e.date, e.billMonth,
      e.currency !== "KRW" ? e.currency : "", e.mode === "split" ? "할부" : e.mode === "monthly" ? "매달 고정" : "일시불",
      e.mode === "split" ? (isFinished(e) ? "완납" : "진행") : ""].filter(Boolean).join(" ").toLowerCase();
    const total = krwTotal(e), per = perMonth(e);
    return q.trim().split(/\s+/).every(raw => {
      const t = raw.toLowerCase();
      if (hay.includes(t)) return true;
      const mk = t.match(/^(\d{1,2})월$/);
      if (mk) return monthsInYear(e, S.year).some(m => +m.slice(5, 7) === +mk[1]);
      const cmp = t.match(/^([<>])\s*(.+)$/);
      if (cmp) { const v = parseAmount(cmp[2]); if (v !== null) return cmp[1] === ">" ? total > v : total < v; }
      const amt = parseAmount(t);
      if (amt !== null) {
        const tol = Math.max(amt * 0.06, 1);
        // 원화 합계·월 납입액뿐 아니라 적은 그대로의 외화 금액으로도 찾게 한다
        return Math.abs(total - amt) <= tol || Math.abs(per - amt) <= tol ||
          (e.currency !== "KRW" && Math.abs((e.amount || 0) - amt) <= tol);
      }
      if (/^\d{4}(-\d{2})?$/.test(t)) return (e.date || "").startsWith(t) || (e.billMonth || "").startsWith(t);
      return false;
    });
  }

  /* ========================== 저장소 ========================== */
  // 같은 화면을 두 곳에서 쓴다.
  //  · 아티팩트  → Claude 저장소 (window.claude)
  //  · 내 PC     → 구글 드라이브 폴더의 장부 파일 (local-db.js 가 window.__LOCAL__ 을 채운다)
  async function useCap(name) {
    if (window.__LOCAL__ && Object.prototype.hasOwnProperty.call(window.__LOCAL__, name)) return window.__LOCAL__[name];
    try { return window.claude ? await window.claude.use(name) : null; } catch (_) { return null; }
  }

  const subs = [];
  async function connectDb() {
    const db = await useCap("db");
    S.db = db;
    if (!db) { S.loaded = true; render(); return; }
    const bind = (col, key, sort) => db.collection(col).onSnapshot(snap => {
      S[key] = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
      if (sort) S[key].sort(sort);
      S.loaded = true; render();
    }, err => { console.warn(col, err); S.loaded = true; render(); });
    subs.push(bind("groups", "groups", (a, b) => (a.order || 0) - (b.order || 0)));
    subs.push(bind("cards", "cards", (a, b) => (a.order || 0) - (b.order || 0)));
    subs.push(bind("cats", "cats", (a, b) => String(a.name || "").localeCompare(String(b.name || ""), "ko")));
    subs.push(bind("entries", "entries", (a, b) => String(b.date || "").localeCompare(String(a.date || ""))));
    subs.push(db.doc("meta/rates").onSnapshot(s => {
      if (s.exists) S.rates = Object.assign({ base: { USD: 1380, CNY: 192 } }, s.data());
      render();
    }, () => {}));
  }
  function dbMsg(err) {
    const c = err && err.code;
    if (c === "quota_exceeded") return "저장 공간이 꽉 찼어요.";
    if (c === "resource_exhausted") return "요청이 몰렸어요. 잠시 뒤 다시.";
    if (c === "not_granted" || c === "revoked") return "여기서는 편집 권한이 없어요.";
    return "저장하지 못했어요.";
  }
  async function put(col, id, body) {
    if (!S.db) { toast("저장소에 연결되지 않았어요.", true); throw new Error("nodb"); }
    try { await S.db.collection(col).doc(id).set(body); }
    catch (err) { toast(dbMsg(err), true); throw err; }
  }
  async function drop(col, id) {
    if (!S.db) return;
    try { await S.db.collection(col).doc(id).delete(); } catch (err) { toast(dbMsg(err), true); }
  }

  /* ========================== 모달 ========================== */
  let closeModal = null;
  function modal(o) {
    if (closeModal) closeModal();
    const body = el("div", { class: "sheet-body" }, o.body);
    const foot = el("div", { class: "sheet-foot" }, o.foot || []);
    const sheet = el("div", { class: "sheet" + (o.wide ? " wide" : "") }, [
      el("div", { class: "sheet-head" }, [
        el("h3", { text: o.title }),
        el("button", { class: "iconbtn", "aria-label": "닫기", onclick: () => close() }, [icon("x", 16)])
      ]),
      body, (o.foot && o.foot.length) ? foot : null
    ]);
    const scrim = el("div", { class: "scrim", onclick: e => { if (e.target === scrim) close(); } }, [sheet]);
    const onKey = e => { if (e.key === "Escape") close(); };
    function close() { document.removeEventListener("keydown", onKey); scrim.remove(); closeModal = null; }
    document.addEventListener("keydown", onKey);
    $("#modalRoot").append(scrim);
    closeModal = close;
    const f = sheet.querySelector(".sheet-body input,.sheet-body select,.sheet-body textarea");
    if (f) setTimeout(() => f.focus(), 30);
    return { close, sheet, body, foot };
  }
  function confirmSheet(title, msg, okLabel, onOk) {
    const m = modal({
      title,
      body: [el("p", { text: msg, style: "margin:0;color:var(--ink-2);font-size:13px;line-height:1.7" })],
      foot: [el("button", { class: "btn quiet", onclick: () => m.close() }, ["취소"]),
        el("button", { class: "btn danger", onclick: async () => { m.close(); await onOk(); } }, [okLabel])]
    });
  }
  const field = (label, control, hint) =>
    el("div", { class: "field" }, [el("label", { text: label }), control, hint ? el("div", { class: "hint", text: hint }) : null]);
  const input = a => el("input", a);
  function select(opts, value, onchange) {
    const s = el("select", { onchange });
    opts.forEach(o => s.append(el("option", { value: o.v }, [o.t])));
    s.value = value;
    return s;
  }
  function segmented(opts, value, onpick) {
    const w = el("div", { class: "seg" });
    opts.forEach(o => w.append(el("button", {
      type: "button", "data-v": o.v, "aria-pressed": String(o.v === value),
      onclick: () => { [...w.children].forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === o.v))); onpick(o.v); }
    }, [o.t])));
    return w;
  }

  /* ========================== 끌어서 순서 바꾸기 ========================== */
  function sortable(container, onOrder) {
    if (!canEdit()) return;
    let dragging = null;
    container.querySelectorAll("[data-sid]").forEach(node => {
      node.draggable = true;
      node.addEventListener("dragstart", e => {
        dragging = node; node.classList.add("dragging");
        try { e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", node.dataset.sid); } catch (_) {}
      });
      node.addEventListener("dragend", () => {
        node.classList.remove("dragging");
        container.querySelectorAll(".over").forEach(n => n.classList.remove("over"));
        dragging = null;
        onOrder([...container.querySelectorAll("[data-sid]")].map(n => n.dataset.sid));
      });
      node.addEventListener("dragover", e => {
        if (!dragging || dragging === node) return;
        e.preventDefault();
        node.classList.add("over");
        const r = node.getBoundingClientRect();
        const after = (e.clientY - r.top) > r.height / 2 || (e.clientX - r.left) > r.width / 2;
        container.insertBefore(dragging, after ? node.nextSibling : node);
      });
      node.addEventListener("dragleave", () => node.classList.remove("over"));
      node.addEventListener("drop", e => { e.preventDefault(); node.classList.remove("over"); });
      // 끌고 난 직후의 클릭은 무시
      let sx = 0, sy = 0;
      node.addEventListener("pointerdown", e => { sx = e.clientX; sy = e.clientY; });
      node.addEventListener("click", e => {
        if (Math.abs(e.clientX - sx) > 6 || Math.abs(e.clientY - sy) > 6) { e.preventDefault(); e.stopPropagation(); }
      }, true);
    });
  }
  async function saveOrder(col, ids) {
    const list = col === "groups" ? S.groups : S.cards;
    let changed = 0;
    for (let i = 0; i < ids.length; i++) {
      const item = list.find(x => x.id === ids[i]);
      if (!item || item.order === i) continue;
      changed++;
      const body = Object.assign({}, item, { order: i });
      delete body.id;
      await put(col, item.id, body);
    }
    if (changed) toast("순서를 바꿨어요.");
  }

  /* ========================== 기록 입력 ========================== */
  function openEntryForm(opts) {
    if (!canEdit()) return toast("모바일에서는 보기만 돼요.");
    const isNew = !opts.entry;
    const e = Object.assign({
      id: uid(), kind: opts.kind, parent: opts.parent, date: todayISO(), title: "",
      amount: 0, currency: "KRW", rate: 0, catId: "", purpose: "", memo: "",
      mode: opts.kind === "card" ? "once" : "split", months: 12, endMonth: "",
      billMonth: ymOf(todayISO()), periodStart: "", periodEnd: ""
    }, opts.entry || {});
    const owner = (opts.kind === "card" ? cardById(e.parent) : groupById(e.parent)) || {};
    e._catText = catName(e.catId);

    const preview = el("div", { class: "hint" });
    const fxLine = el("div", { class: "hint" });

    const dateIn = input({ type: "date", value: e.date, onchange: ev => { e.date = ev.target.value; if (opts.kind === "card" && isNew) { e.billMonth = ymOf(e.date); billIn.value = e.billMonth; } sync(); } });
    const titleIn = input({ value: e.title, placeholder: opts.kind === "card" ? "가맹점" : "항목", oninput: ev => { e.title = ev.target.value; } });
    const amtIn = input({ type: "number", step: "0.01", min: "0", value: e.amount || "", placeholder: "0", oninput: ev => { e.amount = +ev.target.value || 0; sync(); } });
    const rateBox = field("환율", input({ type: "number", step: "0.01", min: "0", value: e.rate || "", placeholder: "자동", oninput: ev => { e.rate = +ev.target.value || 0; sync(); } }));
    const curSel = select([{ v: "KRW", t: "원" }, { v: "USD", t: "$" }, { v: "CNY", t: "¥" }], e.currency, ev => { e.currency = ev.target.value; rateBox.hidden = e.currency === "KRW"; sync(); });
    const monthsIn = input({ type: "number", min: "1", max: "120", value: e.months || 12, oninput: ev => { e.months = Math.max(1, +ev.target.value || 1); sync(); } });
    const endIn = input({ type: "month", value: e.endMonth || "", onchange: ev => { e.endMonth = ev.target.value; sync(); } });
    const billIn = input({ type: "month", value: e.billMonth || ymOf(e.date), onchange: ev => { e.billMonth = ev.target.value; sync(); } });
    const monthsBox = field("개월", monthsIn);
    const endBox = field("끝나는 달", endIn, "비우면 계속");

    const catIn = input({ value: e._catText, placeholder: "생활비 · 가구 · 여행", list: "catlist", oninput: ev => { e._catText = ev.target.value; e.catId = ""; drawCats(); } });
    const catChips = el("div", { class: "chips" });
    function drawCats() {
      catChips.innerHTML = "";
      S.cats.forEach(c => catChips.append(el("button", {
        type: "button", "aria-pressed": String(c.name === e._catText),
        onclick: () => { e.catId = c.id; e._catText = c.name; catIn.value = c.name; drawCats(); }
      }, [c.name])));
    }
    drawCats();

    function sync() {
      const total = krwTotal(e);
      fxLine.textContent = e.currency === "KRW" ? "" : `${CUR[e.currency]}${won(e.amount)} × ${won(rateFor(e))} → ${money(total)}`;
      if (e.mode === "split") {
        const s = startMonth(e), last = addMonths(s, Math.max(1, e.months) - 1);
        preview.textContent = `월 ${money(total / Math.max(1, e.months))} · ${dot(s)} ~ ${dot(last)}` + (last < NOW_YM ? " · 완납" : ` · 지금 ${Math.min(Math.max(seqAt(e, NOW_YM), 1), e.months)}/${e.months}회차`);
      } else if (e.mode === "monthly") preview.textContent = `매달 ${money(total)}${e.endMonth ? ` · ${dot(e.endMonth)}까지` : ""}`;
      else preview.textContent = money(total);
    }

    const body = [
      el("div", { class: "grid2" }, [field(opts.kind === "card" ? "결제일" : "일자", dateIn), field("이름", titleIn)]),
      el("div", { class: "grid3" }, [field("금액", amtIn), field("통화", curSel), rateBox]),
      fxLine,
      el("div", { class: "grid2" }, [
        field("방식", segmented([{ v: "once", t: "일시불" }, { v: "split", t: "할부" }, { v: "monthly", t: "매달" }], e.mode,
          v => { e.mode = v; monthsBox.hidden = v !== "split"; endBox.hidden = v !== "monthly"; sync(); })),
        monthsBox
      ]),
      endBox, preview,
      opts.kind === "card" ? el("div", { class: "grid3" }, [
        field("청구 달", billIn),
        field("기간 시작", input({ type: "date", value: e.periodStart || "", onchange: ev => { e.periodStart = ev.target.value; } })),
        field("기간 끝", input({ type: "date", value: e.periodEnd || "", onchange: ev => { e.periodEnd = ev.target.value; if (e.periodEnd) { e.billMonth = ymOf(e.periodEnd); billIn.value = e.billMonth; sync(); } } }))
      ]) : null,
      field("구분", catIn), catChips,
      /대출|담보|융자/.test(owner.name || "") ? field("용도", input({ value: e.purpose, placeholder: "생활자금 · 전세 · 아파트담보", oninput: ev => { e.purpose = ev.target.value; } })) : null,
      field("메모", el("textarea", { rows: "2", oninput: ev => { e.memo = ev.target.value; } }, [e.memo || ""]))
    ].filter(Boolean);

    monthsBox.hidden = e.mode !== "split";
    endBox.hidden = e.mode !== "monthly";
    rateBox.hidden = e.currency === "KRW";
    sync();

    const m = modal({
      title: (isNew ? "새 기록" : "고치기") + " · " + (owner.name || ""),
      body,
      foot: [
        !isNew ? el("button", { class: "btn danger", onclick: () => { m.close(); confirmSheet("지울까요?", e.title || "이름 없는 기록", "지우기", () => drop("entries", e.id)); } }, ["지우기"]) : null,
        el("button", { class: "btn quiet", onclick: () => m.close() }, ["취소"]),
        el("button", {
          class: "btn primary", onclick: async () => {
            if (!e.amount) return toast("금액을 넣어 주세요.", true);
            const txt = (e._catText || "").trim();
            if (txt) {
              const hit = S.cats.find(c => c.name === txt);
              if (hit) e.catId = hit.id;
              else { e.catId = uid(); await put("cats", e.catId, { name: txt }); }
            } else e.catId = "";
            await put("entries", e.id, {
              kind: e.kind, parent: e.parent, date: e.date, title: (e.title || "").trim() || "이름 없는 기록",
              // 환율은 기록할 때 값을 굳힌다 — 나중에 기준을 바꿔도 지난 기록은 흔들리지 않는다
              amount: e.amount, currency: e.currency, rate: e.currency === "KRW" ? 0 : (e.rate || rateFor(e)), catId: e.catId,
              purpose: e.purpose || "", memo: e.memo || "", mode: e.mode,
              months: e.mode === "split" ? Math.max(1, e.months) : 1,
              endMonth: e.mode === "monthly" ? (e.endMonth || "") : "",
              billMonth: e.kind === "card" ? (e.billMonth || ymOf(e.date)) : "",
              periodStart: e.periodStart || "", periodEnd: e.periodEnd || ""
            });
            m.close(); toast(isNew ? "기록했어요." : "고쳤어요.");
          }
        }, [isNew ? "기록" : "저장"])
      ].filter(Boolean)
    });
    const dl = el("datalist", { id: "catlist" });
    S.cats.forEach(c => dl.append(el("option", { value: c.name })));
    m.sheet.append(dl);
  }

  /* ========================== 칸 · 카드 · 구분 이름 ========================== */
  function openNameForm(kind, item) {
    if (!canEdit()) return toast("모바일에서는 보기만 돼요.");
    const isNew = !item;
    const col = kind === "group" ? "groups" : kind === "card" ? "cards" : "cats";
    const label = kind === "group" ? "기둥" : kind === "card" ? "카드" : "구분";
    const st = Object.assign({ id: uid(), name: "", accent: COLORS[(S[col] || []).length % COLORS.length], order: (S[col] || []).length, cycleDay: 0 }, item || {});
    const nameIn = input({ value: st.name, placeholder: kind === "card" ? "현대카드" : "대출", oninput: ev => { st.name = ev.target.value; if (preview) preview.replaceChildren(icon(iconFor(st.name), 20)); } });
    const preview = kind === "cat" ? null : el("span", { class: "tile-ico", style: `--c:${st.accent};width:34px;height:34px;border-radius:11px` }, [icon(iconFor(st.name), 20)]);
    const body = [field(label + " 이름", nameIn)];
    if (kind !== "cat") {
      const sw = el("div", { class: "chips" });
      COLORS.forEach(c => sw.append(el("button", {
        type: "button", "aria-pressed": String(c === st.accent), style: `background:${c}33;border-color:${c};min-width:34px`,
        onclick: () => { st.accent = c; preview.style.setProperty("--c", c); [...sw.children].forEach((b, i) => b.setAttribute("aria-pressed", String(COLORS[i] === c))); }
      }, [" "])));
      body.push(el("div", { style: "display:flex;align-items:center;gap:12px" }, [preview, sw]));
    }
    if (kind === "card") body.push(field("마감일", input({
      type: "number", min: "1", max: "31", value: st.cycleDay || "", placeholder: "예: 4",
      oninput: ev => { st.cycleDay = Math.max(0, Math.min(31, +ev.target.value || 0)); }
    }), "마감일이 4면 6.5~7.4 가 7월 청구"));
    const used = kind === "cat" ? S.entries.filter(e => e.catId === st.id).length : S.entries.filter(e => e.parent === st.id).length;

    const m = modal({
      title: isNew ? label + " 추가" : label + " 고치기",
      body,
      foot: [
        !isNew ? el("button", {
          class: "btn danger", onclick: () => {
            m.close();
            confirmSheet(label + " 지우기", used ? `기록 ${used}건이 함께 지워져요.` : `"${st.name}" 을 지울까요?`, "지우기", async () => {
              if (kind === "cat") {
                for (const x of S.entries.filter(v => v.catId === st.id)) { const b = Object.assign({}, x); delete b.id; b.catId = ""; await put("entries", x.id, b); }
              } else for (const x of S.entries.filter(v => v.parent === st.id)) await drop("entries", x.id);
              await drop(col, st.id);
              S.view = { type: "dash" }; render();
            });
          }
        }, ["지우기"]) : null,
        el("button", { class: "btn quiet", onclick: () => m.close() }, ["취소"]),
        el("button", {
          class: "btn primary", onclick: async () => {
            if (!st.name.trim()) return toast("이름을 넣어 주세요.", true);
            await put(col, st.id, kind === "cat" ? { name: st.name.trim() }
              : kind === "card" ? { name: st.name.trim(), accent: st.accent, order: st.order, cycleDay: st.cycleDay || 0 }
              : { name: st.name.trim(), accent: st.accent, order: st.order });
            m.close(); toast(isNew ? "추가했어요." : "저장했어요.");
          }
        }, [isNew ? "추가" : "저장"])
      ].filter(Boolean)
    });
  }

  /* ========================== 명세서 읽기 ========================== */
  async function pdfText(file) {
    if (!window.pdfjsLib) throw new Error("no pdfjs");
    try { window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; } catch (_) {}
    const doc = await window.pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
    let out = "";
    for (let p = 1; p <= Math.min(doc.numPages, 12); p++) {
      const tc = await (await doc.getPage(p)).getTextContent();
      out += tc.items.map(i => i.str).join(" ") + "\n";
    }
    return out;
  }

  const READ_PROMPT = [
    "한국 신용카드 명세서를 장부로 옮긴다. JSON 하나만 답하고 설명은 쓰지 마라.",
    '{"periodStart":"YYYY-MM-DD"|null,"periodEnd":"YYYY-MM-DD"|null,"rows":[{"date":"YYYY-MM-DD","title":"가맹점","amount":숫자,"currency":"KRW"|"USD"|"CNY","installmentMonths":정수,"category":"짧은 구분"}]}',
    "amount 는 쉼표·기호 없는 숫자. 일시불이면 installmentMonths 는 1.",
    "periodStart/periodEnd 는 이용기간·결제기간(예: 6월5일~7월4일). 없으면 null.",
    "합계·수수료·포인트·전월이월 줄은 넣지 마라. category 는 내용을 보고 2~4글자로."
  ].join("\n");

  function openStatementReader(cardId) {
    if (!canEdit()) return toast("모바일에서는 보기만 돼요.");
    if (!S.cards.length) return toast("카드를 먼저 추가해 주세요.", true);
    let card = cardById(cardId) || S.cards[0];
    let files = [], parsed = null;

    const cardSel = select(S.cards.map(c => ({ v: c.id, t: c.name })), card.id, ev => { card = cardById(ev.target.value); });
    const zone = el("div", { class: "drop" }, [
      icon("doc", 30), el("div", { html: "여기에 <b>끌어다 놓기</b>" }),
      el("div", { style: "font-size:11.5px" }, ["PDF · 캡처 · 사진"]),
      el("button", { class: "btn sm", type: "button", onclick: () => fileIn.click() }, ["파일 고르기"])
    ]);
    const fileIn = el("input", { type: "file", multiple: "multiple", accept: ".pdf,image/*", style: "display:none", onchange: ev => addFiles(ev.target.files) });
    const list = el("div", { class: "filelist" });
    const status = el("div");
    const reviewBox = el("div", { style: "display:flex;flex-direction:column;gap:12px" });

    function addFiles(fl) {
      files = files.concat([...fl]);
      list.innerHTML = "";
      files.forEach((f, i) => list.append(el("span", { class: "chip" }, [f.name.slice(0, 26),
        el("button", { class: "iconbtn", style: "width:16px;height:16px", "aria-label": "빼기", onclick: () => { files.splice(i, 1); addFiles([]); } }, [icon("x", 11)])])));
      readBtn.disabled = !files.length;
    }
    ["dragenter", "dragover"].forEach(t => zone.addEventListener(t, e => { e.preventDefault(); zone.classList.add("hot"); }));
    ["dragleave", "drop"].forEach(t => zone.addEventListener(t, e => { e.preventDefault(); zone.classList.remove("hot"); }));
    zone.addEventListener("drop", e => { if (e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files); });

    function normalize(d) {
      const rows = (Array.isArray(d && d.rows) ? d.rows : []).map(r => ({
        id: uid(),
        date: /^\d{4}-\d{2}-\d{2}$/.test(r && r.date) ? r.date : todayISO(),
        title: String((r && r.title) || "").slice(0, 60) || "이름 없는 기록",
        amount: Math.abs(+(r && r.amount) || 0),
        currency: ["KRW", "USD", "CNY"].includes(r && r.currency) ? r.currency : "KRW",
        months: Math.max(1, Math.min(60, Math.round(+(r && r.installmentMonths) || 1))),
        category: String((r && r.category) || "").slice(0, 12)
      })).filter(r => r.amount > 0);
      return {
        periodStart: /^\d{4}-\d{2}-\d{2}$/.test(d && d.periodStart) ? d.periodStart : "",
        periodEnd: /^\d{4}-\d{2}-\d{2}$/.test(d && d.periodEnd) ? d.periodEnd : "",
        rows
      };
    }

    const readBtn = el("button", { class: "btn primary", disabled: "disabled", onclick: run }, [icon("spark", 15), "읽기"]);
    async function run() {
      if (!S.sample) { toast("여기서는 자동 읽기를 못 써요. 직접 채워 주세요.", true); parsed = normalize({}); return renderReview(); }
      readBtn.disabled = true;
      status.replaceChildren(el("div", { class: "thinking" }, [el("span", { class: "pulse" }), "읽는 중…"]));
      try {
        const imgs = files.filter(f => /^image\//.test(f.type));
        const pdfs = files.filter(f => /pdf$/i.test(f.type) || /\.pdf$/i.test(f.name));
        let text = "";
        for (const p of pdfs) { try { text += "\n" + (await pdfText(p)); } catch (_) { toast(p.name + " 글자를 못 읽었어요. 캡처를 넣어 보세요.", true); } }
        const opts = { modelTier: "default", cache: false };
        if (imgs.length && S.imagesOK) opts.images = imgs.slice(0, 5);
        parsed = normalize(await S.sample.json(READ_PROMPT + (text.trim() ? "\n\n[본문]\n" + text.slice(0, 18000) : "\n\n[명세서는 첨부 이미지에 있다]"), opts));
        status.replaceChildren();
        renderReview();
      } catch (err) {
        const c = err && err.code;
        status.replaceChildren(el("div", { class: "banner" }, [
          c === "not_granted" ? "Claude 사용을 허용하지 않아 직접 채우기로 넘어갑니다."
            : c === "rate_limited" ? "요청이 몰렸어요. 잠시 뒤 다시 하거나 직접 채워 주세요."
            : "읽지 못했어요. 더 선명한 캡처로 다시 하거나 직접 채워 주세요."
        ]));
        readBtn.disabled = false;
        parsed = normalize({}); renderReview();
      }
    }

    const saveBtn = el("button", { class: "btn primary", hidden: "hidden", disabled: "disabled" }, ["장부에 넣기"]);
    function renderReview() {
      reviewBox.replaceChildren();
      const bill = { ym: parsed.periodEnd ? ymOf(parsed.periodEnd) : "" };
      const warn = el("div", { class: "banner" }, ["결제 기간을 못 찾았어요. 어느 달 청구인지 정해야 해서, 기간을 넣어 주세요."]);
      warn.hidden = !!parsed.periodEnd;

      const peIn = input({ type: "date", value: parsed.periodEnd, onchange: ev => { parsed.periodEnd = ev.target.value; if (parsed.periodEnd) { bill.ym = ymOf(parsed.periodEnd); billIn2.value = bill.ym; warn.hidden = true; } sync(); } });
      const billIn2 = input({ type: "month", value: bill.ym, onchange: ev => { bill.ym = ev.target.value; sync(); } });
      const tb = el("tbody");
      const sumOut = el("div", { class: "hint" });

      function draw() {
        tb.replaceChildren();
        parsed.rows.forEach(r => tb.append(el("tr", {}, [
          el("td", {}, [input({ type: "date", value: r.date, onchange: ev => { r.date = ev.target.value; } })]),
          el("td", {}, [input({ value: r.title, oninput: ev => { r.title = ev.target.value; } })]),
          el("td", { class: "r" }, [input({ type: "number", step: "0.01", value: r.amount, oninput: ev => { r.amount = +ev.target.value || 0; sync(); } })]),
          el("td", {}, [select([{ v: "KRW", t: "원" }, { v: "USD", t: "$" }, { v: "CNY", t: "¥" }], r.currency, ev => { r.currency = ev.target.value; sync(); })]),
          el("td", { class: "r" }, [input({ type: "number", min: "1", value: r.months, oninput: ev => { r.months = Math.max(1, +ev.target.value || 1); } })]),
          el("td", {}, [input({ value: r.category, placeholder: "구분", oninput: ev => { r.category = ev.target.value; } })]),
          el("td", { class: "r" }, [el("button", { class: "iconbtn del", "aria-label": "빼기", onclick: () => { parsed.rows = parsed.rows.filter(x => x.id !== r.id); draw(); sync(); } }, [icon("x", 13)])])
        ])));
        if (!parsed.rows.length) tb.append(el("tr", {}, [el("td", { colspan: "7", style: "text-align:center;color:var(--ink-3);padding:18px" }, ["＋ 로 줄을 채워 주세요"])]));
      }
      function sync() {
        const t = parsed.rows.reduce((s, r) => s + r.amount * (r.currency === "KRW" ? 1 : ((S.rates[ymOf(r.date)] || S.rates.base || {})[r.currency] || 1)), 0);
        sumOut.textContent = `${parsed.rows.length}줄 · ${money(t)}` + (bill.ym ? ` → ${dot(bill.ym)} 청구` : " · 청구 달 필요");
        saveBtn.disabled = !parsed.rows.length || !bill.ym;
      }
      draw();
      reviewBox.append(
        warn,
        el("div", { class: "grid3" }, [
          field("기간 시작", input({ type: "date", value: parsed.periodStart, onchange: ev => { parsed.periodStart = ev.target.value; } })),
          field("기간 끝", peIn),
          field("청구 달", billIn2)
        ]),
        el("div", { class: "table-wrap", style: "border:1px solid var(--edge);border-radius:14px" }, [
          el("table", { class: "rev", style: "min-width:600px" }, [
            el("thead", {}, [el("tr", {}, [el("th", {}, ["결제일"]), el("th", {}, ["내용"]), el("th", { class: "r" }, ["금액"]),
              el("th", {}, ["통화"]), el("th", { class: "r" }, ["할부"]), el("th", {}, ["구분"]), el("th", {}, [""])])]),
            tb
          ])
        ]),
        el("div", { style: "display:flex;gap:10px;align-items:center;flex-wrap:wrap" }, [
          el("button", { class: "btn sm quiet", onclick: () => { parsed.rows.push({ id: uid(), date: parsed.periodEnd || todayISO(), title: "", amount: 0, currency: "KRW", months: 1, category: "" }); draw(); sync(); } }, [icon("plus", 14), "한 줄"]),
          sumOut
        ])
      );
      sync();
      saveBtn.hidden = false;
      m.foot.hidden = false;
      saveBtn.onclick = async () => {
        saveBtn.disabled = true;
        try {
          let n = 0;
          for (const r of parsed.rows) {
            if (!r.amount) continue;
            let catId = "";
            const nm = (r.category || "").trim();
            if (nm) { const hit = S.cats.find(c => c.name === nm); if (hit) catId = hit.id; else { catId = uid(); await put("cats", catId, { name: nm }); } }
            await put("entries", uid(), {
              kind: "card", parent: card.id, date: r.date, title: r.title || "이름 없는 기록",
              amount: r.amount, currency: r.currency,
              rate: r.currency === "KRW" ? 0 : ((S.rates[ymOf(r.date)] || S.rates.base || {})[r.currency] || 1),
              catId, purpose: "", memo: "",
              mode: r.months > 1 ? "split" : "once", months: r.months, endMonth: "",
              billMonth: bill.ym, periodStart: parsed.periodStart || "", periodEnd: parsed.periodEnd || ""
            });
            n++;
          }
          m.close(); toast(`${card.name} · ${dot(bill.ym)} 청구로 ${n}줄 넣었어요.`);
          S.view = { type: "card", id: card.id }; render();
        } catch (_) { saveBtn.disabled = false; }
      };
    }

    const m = modal({
      wide: true, title: "명세서 읽기",
      body: [field("카드", cardSel), zone, fileIn, list, status,
        el("div", { style: "display:flex;gap:9px;flex-wrap:wrap" }, [readBtn,
          el("button", { class: "btn quiet", onclick: () => { parsed = normalize({}); renderReview(); } }, ["직접 채우기"])]),
        reviewBox],
      foot: [el("button", { class: "btn quiet", onclick: () => m.close() }, ["닫기"]), saveBtn]
    });
    m.foot.hidden = true;
  }

  /* ========================== 차트 ========================== */
  function sparkline(series) {
    const W = 600, H = 92, pad = 14, base = H - 20;
    const max = Math.max(1, ...series);
    const bw = (W - pad * 2) / 12;
    const ns = "http://www.w3.org/2000/svg";
    const mk = (t, a, txt) => { const n = document.createElementNS(ns, t); for (const k in a) n.setAttribute(k, a[k]); if (txt !== undefined) n.textContent = txt; return n; };
    const svg = mk("svg", { viewBox: `0 0 ${W} ${H}`, class: "spark", preserveAspectRatio: "none", role: "img",
      "aria-label": `${S.year}년 달별 지출, 가장 큰 달 ${brief(max)}` });
    const nowI = +NOW_YM.slice(5, 7) - 1, thisYear = +NOW_YM.slice(0, 4) === S.year;
    const top = series.indexOf(max);
    series.forEach((v, i) => {
      const h = Math.max(3, (v / max) * (base - 18));
      const x = pad + i * bw + bw * 0.2, w = bw * 0.6;
      const hot = thisYear && i === nowI;
      svg.append(mk("rect", { x, y: base - h, width: w, height: h, rx: 3,
        fill: "#fff", "fill-opacity": hot ? .95 : (v ? .42 : .12) }));
      svg.append(mk("text", { x: x + w / 2, y: H - 5, "text-anchor": "middle", fill: "rgba(255,255,255,.5)",
        "font-size": "9", "font-family": "IBM Plex Sans KR,sans-serif" }, String(i + 1)));
    });
    if (max > 0) {
      const x = Math.min(W - 34, Math.max(34, pad + top * bw + bw / 2));
      svg.append(mk("text", { x, y: 12, "text-anchor": "middle", fill: "rgba(255,255,255,.95)",
        "font-size": "11", "font-weight": "700", "font-family": "IBM Plex Sans KR,sans-serif" }, brief(max)));
    }
    return svg;
  }

  /* ========================== 타일 ========================== */
  function statusPill(e, ym) {
    if (e.mode === "split") {
      if (isFinished(e)) return el("span", { class: "pill mint" }, ["완납"]);
      const s = Math.min(Math.max(seqAt(e, ym || NOW_YM), 1), e.months);
      // 회차 자체가 라벨이다 — 퍼센트 글자 없이 칸을 채워 진행을 보여준다
      return el("span", { class: "pill prog", style: `--p:${Math.round(s / e.months * 100)}%` }, [s + "/" + e.months]);
    }
    if (e.mode === "monthly") return el("span", { class: "pill gold" }, [icon("repeat", 10, 2.2)]);
    return null;
  }

  function pillarTile(g) {
    const list = entriesOf("group", g.id);
    const live = list.filter(e => isRunning(e) && !isFinished(e));
    const shown = (live.length ? live : list.filter(e => monthsInYear(e, S.year).length)).slice(0, 3);
    const rows = el("div", { class: "tile-rows" });
    shown.forEach(e => rows.append(el("div", { class: "tile-row" }, [
      el("span", { class: "t", text: e.purpose || e.title }),
      statusPill(e),
      el("span", { class: "num", style: "flex:none;font-weight:600", text: brief(perMonth(e)) })
    ])));
    if (!shown.length) rows.append(el("div", { class: "tile-row", style: "color:var(--ink-3)" }, [canEdit() ? "＋ 첫 줄 넣기" : "비어 있음"]));

    return el("button", {
      class: "tile", "data-sid": g.id, style: `--c:${g.accent || "#b45cff"}`,
      "aria-label": `${g.name} ${S.year}년 ${money(yearSum(list))}`,
      onclick: () => { S.view = { type: "group", id: g.id }; clearSearch(); render(); }
    }, [
      el("span", { class: "grip", "aria-hidden": "true" }, [icon("grip", 15, 2.4)]),
      el("span", { class: "tile-ico" }, [icon(iconFor(g.name), 20)]),
      el("span", { class: "tile-nm", text: g.name }),
      el("span", { class: "tile-sum", text: brief(yearSum(list)) }),
      rows
    ]);
  }

  function cardTile(c) {
    const list = entriesOf("card", c.id);
    const bills = [...new Set(list.map(e => e.billMonth || ymOf(e.date)))].sort();
    const last = bills[bills.length - 1];
    const lastSum = last ? list.filter(e => (e.billMonth || ymOf(e.date)) === last).reduce((s, e) => s + krwTotal(e), 0) : 0;
    const rows = el("div", { class: "tile-rows" }, [
      last ? el("div", { class: "tile-row" }, [
        el("span", { class: "t", text: cycleLabel(c, last) || dot(last) }),
        el("span", { class: "pill sky" }, [dot(last)]),
        el("span", { class: "num", style: "flex:none;font-weight:600", text: brief(lastSum) })
      ]) : el("div", { class: "tile-row", style: "color:var(--ink-3)" }, [canEdit() ? "＋ 명세서 넣기" : "비어 있음"])
    ]);
    return el("button", {
      class: "tile", "data-sid": c.id, style: `--c:${c.accent || "#ff6fd8"}`,
      "aria-label": `${c.name} ${S.year}년 ${money(yearSum(list))}`,
      onclick: () => { S.view = { type: "card", id: c.id }; clearSearch(); render(); }
    }, [
      el("span", { class: "grip", "aria-hidden": "true" }, [icon("grip", 15, 2.4)]),
      el("span", { class: "tile-ico" }, [icon("card", 20)]),
      el("span", { class: "tile-nm", text: c.name }),
      el("span", { class: "tile-sum", text: brief(yearSum(list)) }),
      rows
    ]);
  }

  /* ========================== 화면 · 한눈에 ========================== */
  function viewDash() {
    const root = el("div", { style: "display:flex;flex-direction:column;gap:26px" });
    const all = S.entries;
    const total = yearSum(all);
    const thisMonth = monthSum(all, NOW_YM);
    const prevMonth = monthSum(all, addMonths(NOW_YM, -1));
    const diff = thisMonth - prevMonth;

    if (all.some(e => e.demo)) root.append(el("div", { class: "banner" }, [
      icon("spark", 16), "예시 기록이에요.",
      el("button", {
        class: "btn sm danger", onclick: () => confirmSheet("예시 지우기", "예시로 넣어 둔 기록만 지웁니다.", "지우기", async () => {
          for (const e of S.entries.filter(x => x.demo)) await drop("entries", e.id);
          toast("예시를 지웠어요.");
        })
      }, ["지우기"])
    ]));

    const hero = el("div", { class: "hero" }, [
      el("div", { class: "eyebrow", text: S.year + " 총 지출" }),
      el("div", { class: "big num", text: money(total) }),
      el("div", { class: "cap" }, [
        el("span", {}, [icon("wallet", 13), " 이달 ", el("b", { class: "num", text: brief(thisMonth) })]),
        prevMonth ? el("span", { style: `color:${diff > 0 ? "var(--rose)" : "var(--mint)"}` }, [(diff > 0 ? "▲ " : "▼ ") + brief(Math.abs(diff))]) : null,
        el("span", {}, [icon("split", 13), " 남은 할부 ", el("b", { class: "num", text: brief(all.reduce((s, e) => s + leftToPay(e), 0)) })])
      ].filter(Boolean)),
      sparkline(monthlySeries(all, S.year))
    ]);

    // 이달 나가는 돈 — 막대로 (글자 대신 길이로)
    const side = el("div", { class: "glass side" }, [
      el("div", { class: "top" }, [icon("clock", 14), el("span", { text: dot(NOW_YM) })]),
      el("div", { class: "v", text: money(thisMonth) })
    ]);
    const parts = S.groups.map(g => ({ n: g.name, c: g.accent || "#b45cff", v: monthSum(entriesOf("group", g.id), NOW_YM) }))
      // 카드는 여러 장을 합친 줄이라 한 장의 색을 쓰지 않는다
      .concat([{ n: "카드", c: "linear-gradient(90deg,#ff6fd8,#7ab8ff)", v: monthSum(S.entries.filter(e => e.kind === "card"), NOW_YM) }])
      .filter(p => p.v > 0).sort((a, b) => b.v - a.v);
    const pmax = Math.max(1, ...parts.map(p => p.v));
    if (parts.length) parts.forEach(p => side.append(el("div", { class: "bar-row" }, [
      el("span", { class: "k", text: p.n }),
      el("span", { class: "track" }, [el("span", { class: "fill", style: `width:${Math.max(4, p.v / pmax * 100)}%;background:${p.c}` })]),
      el("span", { class: "v num", text: brief(p.v) })
    ])));
    else side.append(el("div", { style: "color:var(--ink-3);font-size:12.5px;padding:6px 0" }, ["이달 지출 없음"]));

    // 앞으로 나갈 돈 — 고정·할부는 이미 정해져 있으니 미리 보여준다
    const next = [1, 2, 3].map(k => { const m = addMonths(NOW_YM, k); return { m, v: monthSum(all, m) }; }).filter(x => x.v > 0);
    if (next.length) {
      // 눈금은 '이번 달'에 맞춘다 — 앞으로가 이번 달보다 큰지 한눈에 보이게
      const fmax = Math.max(thisMonth, ...next.map(x => x.v));
      side.append(el("div", { class: "top", style: "margin-top:12px;padding-top:12px;border-top:1px solid var(--edge)" },
        [icon("chart", 13), el("span", { text: "앞으로" })]));
      next.forEach(x => side.append(el("div", { class: "bar-row" }, [
        el("span", { class: "k", text: dot(x.m) }),
        el("span", { class: "track" }, [el("span", { class: "fill", style: `width:${Math.max(4, x.v / fmax * 100)}%;background:rgba(255,255,255,.28)` })]),
        el("span", { class: "v num", text: brief(x.v) })
      ])));
    }

    root.append(el("div", { class: "hero-row" }, [hero, side]));

    // 기둥
    const gWrap = el("div", { class: "tiles" });
    S.groups.forEach(g => gWrap.append(pillarTile(g)));
    if (canEdit()) gWrap.append(el("button", { class: "tile-add", onclick: () => openNameForm("group") }, [icon("plus", 22)]));
    root.append(el("section", { class: "sec" }, [
      el("div", { class: "sec-head" }, [icon("chart", 15), el("h2", { text: "기둥" }),
        el("span", { class: "sum num", text: brief(yearSum(S.entries.filter(e => e.kind === "group"))) })]),
      gWrap
    ]));
    sortable(gWrap, ids => saveOrder("groups", ids));

    // 카드
    const cWrap = el("div", { class: "tiles" });
    S.cards.forEach(c => cWrap.append(cardTile(c)));
    if (canEdit()) cWrap.append(el("button", { class: "tile-add", onclick: () => openNameForm("card") }, [icon("plus", 22)]));
    root.append(el("section", { class: "sec" }, [
      el("div", { class: "sec-head" }, [icon("card", 15), el("h2", { text: "카드" }),
        canEdit() ? el("button", { class: "btn sm", onclick: () => openStatementReader() }, [icon("doc", 14), "명세서"]) : null,
        el("span", { class: "sum num", text: brief(yearSum(S.entries.filter(e => e.kind === "card"))) })].filter(Boolean)),
      cWrap
    ]));
    sortable(cWrap, ids => saveOrder("cards", ids));

    root.append(el("section", { class: "sec" }, [
      el("div", { class: "sec-head" }, [icon("tag", 15), el("h2", { text: "구분" })]),
      miniRow()
    ]));
    return root;
  }

  function miniRow() {
    const wrap = el("div", { class: "minis" });
    const byCat = {};
    S.entries.forEach(e => { const v = yearTotal(e, S.year); if (v) byCat[e.catId || ""] = (byCat[e.catId || ""] || 0) + v; });
    const top = Object.entries(byCat).sort((a, b) => b[1] - a[1]).slice(0, 4);
    top.forEach(([cid, v]) => wrap.append(el("button", {
      class: "mini", onclick: () => { S.view = { type: "cat", id: cid }; render(); }
    }, [
      el("div", { class: "top" }, [icon("tag", 13), el("span", { class: "c", text: catName(cid) || "구분 없음" })]),
      el("div", { class: "v", text: brief(v) })
    ])));
    const running = S.entries.filter(e => e.mode === "split" && isRunning(e));
    wrap.append(el("div", { class: "mini" }, [
      el("div", { class: "top" }, [icon("split", 13), el("span", { class: "c", text: "남은 할부" })]),
      el("div", { class: "v", text: brief(S.entries.reduce((s, e) => s + leftToPay(e), 0)) }),
      el("div", { class: "c", text: running.length ? running.length + "건" : "없음" })
    ]));
    const base = S.rates.base || {};
    wrap.append(el("button", { class: "mini", onclick: () => { S.view = { type: "rates" }; render(); } }, [
      el("div", { class: "top" }, [icon("fx", 13), el("span", { class: "c", text: "환율" })]),
      el("div", { class: "v", style: "font-size:15px", text: `$${won(base.USD || 0)} · ¥${won(base.CNY || 0)}` })
    ]));
    if (!top.length) wrap.prepend(el("div", { class: "mini" }, [
      el("div", { class: "top" }, [icon("tag", 13), el("span", { class: "c", text: "구분" })]),
      el("div", { class: "v", style: "font-size:14px;color:var(--ink-3)", text: "기록하면 모여요" })
    ]));
    return wrap;
  }

  /* ========================== 화면 · 장부 ========================== */
  function ledger(list, opts) {
    const rows = list.filter(e => matchEntry(e, S.q));
    if (!rows.length) return el("div", { class: "empty" }, [
      icon(S.q ? "search" : "doc", 26),
      el("div", { text: S.q ? "맞는 줄이 없어요" : "비어 있어요" }),
      (opts.onAdd && canEdit() && !S.q) ? el("button", { class: "btn primary", onclick: opts.onAdd }, [icon("plus", 14), "첫 줄"]) : null
    ].filter(Boolean));

    const tb = el("tbody");
    let lastM = null;
    rows.slice().sort((a, b) => (startMonth(b) + (b.date || "")).localeCompare(startMonth(a) + (a.date || ""))).forEach(e => {
      const m = startMonth(e);
      if (opts.byMonth && m !== lastM) {
        lastM = m;
        const t = rows.filter(x => startMonth(x) === m).reduce((s, x) => s + krwTotal(x), 0);
        tb.append(el("tr", { class: "mhead" }, [el("td", { colspan: "5", text: dot(m) }), el("td", { class: "r num", text: money(t) }), el("td", {})]));
      }
      const fin = isFinished(e);
      tb.append(el("tr", { class: fin ? "done" : "" }, [
        el("td", { class: "num", style: "color:var(--ink-3)", text: e.date }),
        el("td", {}, [el("div", { style: "font-weight:600", text: e.title }),
          (e.purpose || e.memo) ? el("div", { style: "font-size:11px;color:var(--ink-3)", text: [e.purpose, e.memo].filter(Boolean).join(" · ") }) : null]),
        el("td", {}, [catName(e.catId) ? el("span", { class: "pill" }, [catName(e.catId)]) : el("span", { style: "color:var(--ink-3)" }, ["—"])]),
        el("td", {}, [statusPill(e) || el("span", { style: "color:var(--ink-3)", text: "—" })]),
        el("td", { class: "r num", style: "color:var(--ink-3)", text: e.mode === "once" ? "—" : brief(perMonth(e)) }),
        el("td", { class: "r num", style: "font-weight:600", text: (e.currency !== "KRW" ? CUR[e.currency] + won(e.amount) + " → " : "") + money(krwTotal(e)) }),
        el("td", {}, [el("div", { class: "rowbtns" }, canEdit() ? [
          el("button", { class: "iconbtn", "aria-label": "고치기", onclick: () => openEntryForm({ kind: e.kind, parent: e.parent, entry: e }) }, [icon("pencil", 14)]),
          el("button", { class: "iconbtn del", "aria-label": "지우기", onclick: () => confirmSheet("지울까요?", e.title, "지우기", () => drop("entries", e.id)) }, [icon("x", 14)])
        ] : [])])
      ]));
    });
    return el("div", { class: "table-wrap" }, [el("table", {}, [
      el("thead", {}, [el("tr", {}, [el("th", {}, ["일자"]), el("th", {}, ["내용"]), el("th", {}, ["구분"]),
        el("th", {}, ["회차"]), el("th", { class: "r" }, ["월"]), el("th", { class: "r" }, ["금액"]), el("th", {}, [""])])]),
      tb
    ])]);
  }

  function detailHero(o) {
    return el("div", { class: "hero", style: o.accent ? `background:linear-gradient(140deg,${o.accent}5c 0%,rgba(120,38,214,.34) 52%,rgba(255,111,216,.16) 100%),var(--glass)` : null }, [

      el("div", { style: "display:flex;align-items:center;gap:12px;margin:2px 0 4px" }, [

          el("button", { class: "btn sm primary", onclick: () => openStatementReader(c.id) }, [icon("doc", 14), "명세서"])

      ]),
